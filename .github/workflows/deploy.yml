name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify source entry is not a prebuilt bundle
        run: |
          grep -q 'src="/src/main.tsx"' index.html
          test ! -d assets

      - run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/flowui/index.html
          test -f dist/infinite-runner/index.html
          test -f dist/Infinite_Runners/index.html
          test -d dist/infinite-runner/chapters
          grep -q 'assets/index-' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
